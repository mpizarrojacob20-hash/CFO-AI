<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jacob IA</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jacob IA" />
<style>
  :root {
    --bg: #000000;
    --panel: #000000;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #ffffff;
    --accent-fg: #000000;
    --bubble-user: #ffffff;
    --bubble-user-fg: #000000;
    --bubble-jacob: #1a1a1a;
    --bubble-jacob-fg: #ffffff;
    --border: #333333;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .subtitle { font-size: 12px; color: var(--muted); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .msg.jacob {
    align-self: flex-start;
    background: var(--bubble-jacob);
    color: var(--bubble-jacob-fg);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-jacob);
    color: var(--muted);
    font-style: italic;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    border: 1px solid #b3453f;
    color: #b3453f;
    font-size: 13px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 120px;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button#send {
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">J</div>
    <div>
      <div class="title">Jacob IA</div>
      <div class="subtitle">Contador · CFO · Auditor · Administrador</div>
    </div>
  </header>

  <div id="messages"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje..." autofocus></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  const history = [];

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    const typing = addBubble("typing", "Jacob está escribiendo...");

    try {
      const resp = await fetch("/api/jacob-agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      const data = await resp.json();
      typing.remove();

      if (!resp.ok) {
        addBubble("error", data.error || "Ocurrió un error.");
        return;
      }

      addBubble("jacob", data.reply);
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      typing.remove();
      addBubble("error", "No se pudo conectar con Jacob. Intenta de nuevo.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  form.addEventListener("keydown", () => {});
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
